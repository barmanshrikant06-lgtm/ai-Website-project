
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #080b14;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-container {
    width: 95%;
    max-width: 750px;
    height: 90vh;
    background: #111827;
    border: 1px solid #263247;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    padding: 20px;
    background: #172033;
    text-align: center;
    border-bottom: 1px solid #29364c;
}

.header h2 {
    color: #00e5ff;
}

.header p {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 5px;
}

#chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 85%;
    padding: 13px 16px;
    border-radius: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #075985;
    align-self: flex-end;
}

.bot {
    background: #263247;
    align-self: flex-start;
}

.input-area {
    padding: 15px;
    display: flex;
    gap: 10px;
    background: #172033;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #34445e;
    border-radius: 10px;
    background: #0b1220;
    color: white;
    outline: none;
    min-width: 0;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #00d5ed;
    color: #07111d;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.status {
    color: #9ca3af;
    font-size: 12px;
    text-align: center;
    padding: 5px;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>⚡ Groq AI Assistant</h2>
        <p>Powered by Groq API</p>
    </div>

    <div id="chat-box">
        <div class="message bot">
            Hello! 👋 I am your AI assistant.
            Ask me anything!
        </div>
    </div>

    <div class="status" id="status">Ready to chat</div>

    <div class="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Ask me anything..."
            autocomplete="off"
        >
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

// Add your Groq API key here.
// For testing only. Never publish a real API key in GitHub.

const API_KEY = "YOUR_GROQ_API_KEY";

// Select a model available to your Groq account.
const MODEL = "llama-3.3-70b-versatile";

const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("send-btn");

let history = [];

function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    if (API_KEY === "YOUR_GROQ_API_KEY") {
        addMessage("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", "bot");
        return;
    }

    addMessage(message, "user");
    input.value = "";

    history.push({
        role: "user",
        content: message
    });

    sendBtn.disabled = true;
    statusText.textContent = "AI is thinking...";

    try {

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + API_KEY
                },

                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: "You are a helpful AI assistant. Answer clearly and politely."
                        },
                        ...history
                    ],
                    temperature: 0.7,
                    max_tokens: 1024
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const answer =
            data.choices?.[0]?.message?.content ||
            "No response received.";

        history.push({
            role: "assistant",
            content: answer
        });

        addMessage(answer, "bot");
        statusText.textContent = "Ready to chat";

    } catch (error) {

        addMessage("Error: " + error.message, "bot");
        statusText.textContent = "Something went wrong";

    } finally {

        sendBtn.disabled = false;
        input.focus();

    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script>

</body>
</html>
